name: Publish to npm

# Publishes on the v* tag that `pnpm version patch` pushes (via the postversion
# hook). Uses npm trusted publishing (OIDC), so there is no NPM_TOKEN secret:
# the package's trusted publisher is cmdcolin/jbrowse-plugin-ucsc-api with this
# workflow file, set with
#   npm trust github jbrowse-plugin-ucsc --file publish.yml --repo cmdcolin/jbrowse-plugin-ucsc-api --allow-publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
